plugins {
	id 'java'
	id 'com.vaadin' version "${vaadinVersion}"
	id 'org.cyclonedx.bom' version "${cyclonedxVersion}"
	id 'com.gorylenko.gradle-git-properties' version "${gradleGitPropertiesVersion}"
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
	id 'org.eclipse.jkube.kubernetes' version "${jkubeVersion}"
}

group = 'org.cftoolsuite'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://maven.vaadin.com/vaadin-addons/' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation "org.apache.commons:commons-collections4:${commonsCollections4Version}"
	implementation "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"
	implementation "io.github.openfeign:feign-hc5:${feignHc5Version}"
	implementation "com.playtika.reactivefeign:feign-reactor-spring-cloud-starter:${feignReactorVersion}"
	implementation 'com.vaadin:vaadin-spring-boot-starter'
	implementation "org.vaadin.olli:file-download-wrapper:${fileDownloadWrapperVersion}"
	implementation 'org.apache.commons:commons-lang3'
	implementation "io.pivotal.cfenv:java-cfenv-all:${cfenvVersion}"
	implementation "org.springframework.cloud:spring-cloud-bindings:${springCloudBindingsVersion}"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		mavenBom "com.vaadin:vaadin-bom:${vaadinVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

bootRun {
    systemProperties System.properties
}

tasks.named('bootBuildImage') {
	imageName = "docker.io/${project.group.contains('.') ? project.group.tokenize('.').last() : project.group}/${project.name}:${project.version}"
	tags = [ "docker.io/${project.group.contains('.') ? project.group.tokenize('.').last() : project.group}/${project.name}:latest" ]
}

kubernetes {
	buildStrategy = 'buildpacks'
    generator {
        config {
            'spring-boot' {
                color = 'always'
            }
        }
    }
    helm {
        maintainers = [{
            name = 'Chris Phillipson'
        }]
    }
}

tasks.register('setVersion') {
	doLast {
		def newVersion = project.hasProperty('newVersion') ? project.newVersion : version
		ant.propertyfile(file: "gradle.properties") {
			entry(key: "version", value: newVersion)
		}
	}
}

tasks.register('printArtifactPath') {
	doLast {
		println bootJar.archiveFile.get().asFile.absolutePath
	}
}
